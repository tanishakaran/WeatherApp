<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Let's Know Weather</title>
  <link rel="stylesheet" href="style/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body class="day-theme">

  <div id="particles-js"></div>

  <div class="app">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1 class="title">🌤️ Let's Know Weather</h1>
      <button id="themeToggle">🌙 Theme</button>
    </div>

    <div class="search-area">
      <input type="text" id="cityInput" placeholder="Enter city name" />
      <button id="searchBtn">Search</button>
      <button id="locationBtn"><i class="fas fa-crosshairs"></i></button>
      <button id="voiceBtn"><i class="fas fa-microphone"></i></button>
    </div>

    <div class="error"></div>
    <div class="weather-info"></div>
    <canvas id="forecastChart"></canvas>
    <div class="quote"></div>
    <div class="log"></div>
  </div>

  <div class="wave"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script src="script/script.js"></script>

  <script>
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("night-theme");
      document.body.classList.toggle("day-theme");
      if (typeof drawChart === "function" && typeof latestForecastData !== "undefined") {
        drawChart(latestForecastData);
      }
    });

    particlesJS("particles-js", {
      particles: {
        number: { value: 60 },
        size: { value: 3 },
        color: { value: "#ffffff" },
        line_linked: {
          enable: true,
          distance: 130,
          color: "#ffffff",
          opacity: 0.4,
          width: 1
        },
        move: {
          enable: true,
          speed: 1.5
        }
      },
      interactivity: {
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>

</body>
</html>
